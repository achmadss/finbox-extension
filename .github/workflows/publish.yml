name: Publish

# By hand. Publishing is a decision — a merge to main is not one, and a rebuilt
# APK is not byte-identical, so an automatic run would hand the app new hashes
# for versions it already has.
on:
  workflow_dispatch:

# Two publishes at once would race on repo/index.json.
concurrency:
  group: publish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # compileSdk 36. Not on PATH, hence the full path.
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"

      # Release APKs are signed with the debug config, and a runner makes itself
      # a fresh debug key on first use. Android refuses an update signed by a
      # different key than the installed APK, so the real one has to be restored
      # or every published parser becomes uninstallable over the old one.
      - name: Restore the signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          test -n "$DEBUG_KEYSTORE" || { echo "DEBUG_KEYSTORE secret is not set"; exit 1; }
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore

      # Runs the tests, builds only the parsers with no APK for the version
      # they currently declare, and regenerates the index.
      - run: ./tools/publish.sh

      - name: Commit the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo
          # Nothing to say when the APKs and the index came out unchanged.
          git diff --cached --quiet || { git commit -m "Publish parsers"; git push; }
